services:
  db:
    image: docker.io/mysql:8.0
    environment:
      MYSQL_DATABASE: database
      MYSQL_USER: user
      MYSQL_PASSWORD: user_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306/tcp"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uuser", "-puser_password"]
      interval: 5s
      timeout: 3s
      retries: 20

  php:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: database
      DB_USER: user
      DB_PASSWORD: user_password
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@example.com}
    volumes:
      - ./src:/var/www/html
      - uploads_data:/var/www/html/uploads
      - vendor_data:/var/www/html/vendor:ro
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: docker.io/nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src:/var/www/html:ro
      - uploads_data:/var/www/html/uploads:ro
    ports:
      - "80:80/tcp"
    depends_on:
      - php

volumes:
  mysql_data:
  uploads_data:
  vendor_data:
